[project]
name = "plex-video-manager"
version = "0.1.0"
description = "Project to manage downloaded videos for Plex Media Server. Note to use all functionality, both ffmpeg and mkvmerge must be installed and accessible on PATH"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymkv2>=2.3.2",
    "pysrt>=1.1.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
plex_video_manager = "plex_video_manager.download_handler:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
